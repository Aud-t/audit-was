spring.application.name=hannoon

spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

#Slack-log
logging.slack.config=classpath:logback-spring.xml
logging.slack.webhook-url=${SLACK_WEBHOOK_URL:}
